plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.idimus.simmusic'
    compileSdk 36

    defaultConfig {
        applicationId "com.idimus.simmusic"
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName "1.0.2"
    }

    // Same keystore and Keychain item as 7UI; without them the release build stays unsigned.
    def keystorePath = findProperty('SEVENUI_KEYSTORE')
    def keyAliasProp = findProperty('SEVENUI_KEY_ALIAS')
    def keychainPassword = {
        try {
            def p = ['security', 'find-generic-password', '-s', '7ui-release-key', '-w'].execute()
            def out = p.text.trim()
            p.waitFor() == 0 ? out : null
        } catch (Exception ignored) { null }
    }
    signingConfigs {
        release {
            if (keystorePath && keyAliasProp) {
                def pw = keychainPassword()
                if (pw) {
                    storeFile file(keystorePath)
                    storePassword pw
                    keyAlias keyAliasProp
                    keyPassword pw
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (signingConfigs.release.storeFile) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
}
